name: "Playwright Automated Test Suite"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      scenario:
        description: "Task or Scenario to run"
        required: true
        default: "task3_all"
        type: choice
        options:
          - "task3_all"
          - "task3_1"
          - "task3_2"
          - "task3_3"
          - "task3_4"
          - "run_generated"
          - "all_tests"

jobs:
  test:
    name: "Run Playwright Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PGX_URL: "https://pgx-dev.datum.bio/"
      PGX_USERNAME: ${{ secrets.PGX_USERNAME }}
      PGX_PASSWORD: ${{ secrets.PGX_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HEADLESS: "true"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Install Playwright Chromium & OS Dependencies"
        run: |
          playwright install --with-deps chromium

      - name: "Execute Selected Test Scenario"
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'task3_all' }}"
          echo "Executing test scenario: $SCENARIO"

          if [ "$SCENARIO" = "task3_all" ]; then
            python run_task3.py --task all
          elif [ "$SCENARIO" = "task3_1" ]; then
            python run_task3.py --task 1
          elif [ "$SCENARIO" = "task3_2" ]; then
            python run_task3.py --task 2
          elif [ "$SCENARIO" = "task3_3" ]; then
            python run_task3.py --task 3
          elif [ "$SCENARIO" = "task3_4" ]; then
            python run_task3.py --task 4
          elif [ "$SCENARIO" = "run_generated" ]; then
            python runner.py --scenario run_generated --approve
          elif [ "$SCENARIO" = "all_tests" ]; then
            pytest tests/ --html=artifacts/report.html --self-contained-html -v
          else
            python run_task3.py --task all
          fi

      - name: "Upload Test Report & Failure Artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-artifacts
          path: |
            artifacts/report.html
            artifacts/screenshots/
          retention-days: 14

      - name: "Post Job Summary"
        if: always()
        run: |
          echo "### Test Execution Completed" >> $GITHUB_STEP_SUMMARY
          if [ -f "artifacts/report.html" ]; then
            echo "- HTML report generated and uploaded as artifact: **playwright-test-artifacts**" >> $GITHUB_STEP_SUMMARY
          fi
